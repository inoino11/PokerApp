<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b6e3c" />
    <!-- iPhone はホーム画面に追加するときの名前を manifest.json ではなくここ（なければ title）から取る -->
    <meta name="apple-mobile-web-app-title" content="シマリス" />
    <title>シマリス - ポーカーチップ管理 -</title>
    <meta name="description" content="テキサスホールデムのチップのやり取りを、1 台のスマホで管理するツール。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="シマリス - ポーカーチップ管理 -" />
    <meta property="og:description" content="テキサスホールデムのチップのやり取りを、1 台のスマホで管理するツール。" />
    <meta property="og:url" content="https://chipmunk.inoino11.com/" />
    <meta property="og:image" content="https://chipmunk.inoino11.com/ogp-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PokerApp.styles.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <!--

        ██████████████████
        ██████████████████
        ██████████████████
      ████  ██████████  ████
      ████  ██████████  ████
      ████████████████████
        ██████████████████
        ██████████████████
        ██████████████████
            ██  ██      ██  ██
            ██  ██      ██  ██
            ██  ██      ██  ██

            シマリスは英語でChipmunk

    -->
    <div id="app"></div>

    <!-- 起動中の全画面表示。MainLayout の描画後に appLoading.hide で消す -->
    <div id="app-loading">
        <!-- アイコンのチップ（wwwroot/chip.svg と同じ絵）。読み込みを待たずに出すため、ここに直接書く。はじいたように跳ねて回る -->
        <div class="app-loading-chip">
            <svg viewBox="-170 -170 340 340" aria-hidden="true">
                <circle r="168" fill="#fff" />
                <g fill="#1b6e3c">
                    <rect x="-22" y="-154" width="44" height="34" rx="6" />
                    <rect x="-22" y="-154" width="44" height="34" rx="6" transform="rotate(45)" />
                    <rect x="-22" y="-154" width="44" height="34" rx="6" transform="rotate(90)" />
                    <rect x="-22" y="-154" width="44" height="34" rx="6" transform="rotate(135)" />
                    <rect x="-22" y="-154" width="44" height="34" rx="6" transform="rotate(180)" />
                    <rect x="-22" y="-154" width="44" height="34" rx="6" transform="rotate(225)" />
                    <rect x="-22" y="-154" width="44" height="34" rx="6" transform="rotate(270)" />
                    <rect x="-22" y="-154" width="44" height="34" rx="6" transform="rotate(315)" />
                    <circle r="100" />
                </g>
                <circle r="78" fill="none" stroke="#fff" stroke-width="8" />
                <g transform="translate(-8 -12)" fill="#fff">
                    <path d="M14,48 C46,40 48,4 32,-14 C22,-26 34,-34 42,-24" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" />
                    <ellipse cx="-2" cy="28" rx="24" ry="28" />
                    <ellipse cx="-8" cy="-24" rx="5" ry="9" />
                    <circle cx="-14" cy="-6" r="17" /><circle cx="-28" cy="0" r="9" /><circle cx="-16" cy="5" r="13" />
                    <ellipse cx="-4" cy="55" rx="20" ry="5" />
                    <circle cx="-19" cy="-10" r="3.2" fill="#1b6e3c" />
                    <path d="M-4,10 C8,16 14,30 12,44" fill="none" stroke="#1b6e3c" stroke-width="4" stroke-linecap="round" />
                </g>
            </svg>
        </div>
        <div class="app-loading-shadow"></div>
        <div class="app-loading-text">チップ準備中...</div>
        <div id="app-loading-error" hidden>
            <p>起動に失敗しました</p>
            <button type="button" onclick="appLoading.recover()">修復して再読み込み</button>
        </div>
    </div>

    <div id="blazor-error-ui">
        問題が発生
        <a href="." class="reload">再読み込み</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        Blazor.start().catch(e => { console.error(e); appLoading.fail(); });

        // 新しい版を見つけたら確かめてから切り替える
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                const ask = worker => {
                    if (confirm('新しいバージョンがあります。更新しますか？')) worker.postMessage({ type: 'SKIP_WAITING' });
                };
                if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
                reg.addEventListener('updatefound', () => {
                    const w = reg.installing;
                    w?.addEventListener('statechange', () => {
                        if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w);
                    });
                });
            });
            let reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (reloaded) return;
                reloaded = true;
                location.reload();
            });
        }
    </script>
</body>

</html>
